name: ci

on:
  push:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install
        run: python -m pip install -e ".[dev,spark]"
      - name: Lint
        run: |
          ruff check src generate tests pipelines jobs
          ruff format --check src generate tests pipelines jobs
      - name: Test
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
        run: pytest -q
