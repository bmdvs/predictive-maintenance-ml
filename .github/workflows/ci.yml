name: ci

# Lint and tests on every push and pull request. The bundle is validated against the prod target on
# pull requests from this repository and on pushes to main only when the repository secrets
# DATABRICKS_HOST, DATABRICKS_CLIENT_ID and DATABRICKS_CLIENT_SECRET (the deploy service principal's
# OAuth secret) are set; without them the job is skipped. The deploy job ran through the shadow quarter
# and was removed; restoring validation or a deploy job needs the three secrets restored. Nothing secret
# or workspace-specific is in the repository.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install
        run: python -m pip install -e ".[dev,spark]"
      - name: Lint
        run: |
          ruff check src generate tests pipelines jobs
          ruff format --check src generate tests pipelines jobs
      - name: Test
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
        run: pytest -q

  secrets-check:
    runs-on: ubuntu-latest
    outputs:
      has_host: ${{ steps.check.outputs.has_host }}
    steps:
      - id: check
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
        run: |
          if [ -n "$DATABRICKS_HOST" ]; then echo "has_host=true" >> "$GITHUB_OUTPUT"; else echo "has_host=false" >> "$GITHUB_OUTPUT"; fi

  bundle-validate:
    needs: [lint-test, secrets-check]
    if: >-
      needs.secrets-check.outputs.has_host == 'true'
      && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      BUNDLE_VAR_deploy_sp: ${{ secrets.DATABRICKS_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: databricks/setup-cli@v1.22.1
      - name: Validate (prod)
        run: databricks bundle validate -t prod
