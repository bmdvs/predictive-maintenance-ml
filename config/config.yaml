  pm_check: {task: spindle_lube_check, min_residual_c: 2.0, detection_prob: 0.6}   # after run-05: spindle chiller check added to the monthly spindle lube check
  alarm_inspection_min_alarms_per_shift: 2  # after run-05: lubrication or stage-4 overheat alarms in one shift that open an inspection
  repair_days: [1, 3]                       # rev2 M3: spare or rental chiller (was repair_hours [4, 12])

