  rotary_union_age_at_record_start_tsc_h: [0, 4000]   # NEW
  tsc_pressure_drop_frac: [0.05, 0.15]      # 5 to 15%
  ingress_fraction_of_leaks: 0.4            # 0.3 to 0.5; about 3.0 ingress episodes (target 0 to 6; rev2, was 1.5 and 0 to 3 after run-06)
  leak_to_ingress_days: [3, 14]             # NEW
