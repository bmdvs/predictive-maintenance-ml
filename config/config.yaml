    fleet_mtbf_running_h: [9000, 15000]
    hmc_spindle_bearing_failures: [2, 8]           # amended 2026-10-29 at run07 checkpoint (a) under rule 8 (run07 value 2, within the expected spread); rev2 x2 was [4, 8]; original [2, 4]
