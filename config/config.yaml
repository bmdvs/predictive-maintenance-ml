  operator_notice_binomial_alpha: 0.05              # after run-05: check 22
  thermal_velocity_min_days: 5                      # before run-05: check 22 velocity test only on episodes of at least this many days
  inner_race_exclude_shaft_orders: [1, 2, 3, 4]     # after run-01: check 3 inner-race top peak excludes shaft-rate harmonics
  sideband_line_min_ratio: 12                       # after run-03: check 3 sidebands tested on stage-2 hours with the BPFI line >= 12x the local floor
  sideband_tested_kinds: [deep_groove_ball, cylindrical_roller]   # after run-03: angular-contact sidebands report-only
  crash_binomial_alpha: 0.05                        # approved 2026-10-21: outcome shares tested against configured proportions
  regime_comparison: fixed_offset_report_only       # after run-03: same vendor offset rule, one baseline per point against one per point and load band; percentile comparison removed
  downtime_reconcile_basis: scheduled_overlap_times_utilization   # approved 2026-10-21, check 15
  instrumented_assets: [HMC-01-SP, HMC-02-SP, HMC-03-SP, HMC-04-SP, HMC-05-SP, HMC-06-SP, HMC-07-SP, HMC-08-SP, HMC-01-TSC, HMC-02-TSC, HMC-03-TSC, HMC-04-TSC, HMC-05-TSC, HMC-06-TSC, HMC-07-TSC, HMC-08-TSC, HMC-01-CP, HMC-02-CP, HMC-03-CP, HMC-04-CP, HMC-05-CP, HMC-06-CP, HMC-07-CP, HMC-08-CP, CMP-01, CMP-02, CMP-03, CMP-04]   # rev2: 28 (was 14)
  technician_labor_share_max: 0.80          # rev2 check 27
  crash_share_hmc_spindle_published: [0.30, 0.60]   # rev2 check 29, reported
  housing_share_of_residual_check: [0.5, 1.0]       # rev2 check 23, pooled per point class (pilot04 decision 8)
  housing_check_settled_cutting_h: 6                # rev2 check 23 estimator (pilot04): hours after 6 consecutive cutting hours (housing lag settled), excluding stage 3+ or lubrication heat on the point
  abrupt_overheat_within_h: 6                       # rev2 check 23, amended 2026-10-29 at run07 checkpoint (a) under rule 8: an abrupt fault reaches the limit within 6 cutting hours at a speed whose expected reading (shop ambient, speed term, cooler residual) reaches the limit; low-speed plateau hours reported (run07: HMC-04 held 42.9 C at 3,350 rpm, HMC-08 44.5 C at 4,700 rpm); original: overheat stop within 6 h of the first cutting hour
  lube_trend_alpha: 0.05                            # rev2 check 28: Poisson trend test across record years
  expected_ranges:
