# predictive-maintenance-ml configuration
# Blocks marked [plant] are plant-behavior parameters (CLAUDE.md section 8): changeable between runs with approval.
# Blocks marked [fixed] are measurement definitions, indicator formulas, rule thresholds, splits and chance levels:
# set once at config approval, never changed to hit a target.
# Ranges in comments are the CLAUDE.md ranges each value sits inside.

meta:                                     # [fixed]
  config_version: 12                      # rev2 2026-10-29 (was 11, run-06)
  generator_version: 0.4.2                # run09: CMMS failure codes in one convention (was 0.4.1 for run08; 0.4.0 for run07; 0.3.0 before rev2)
  run_seed: 20230701
  record: {start: 2023-07-01, end: 2026-06-30}
  shadow: {start: 2025-07-01, end: 2026-06-30}   # rev2: shadow year (was 2026-04-01 to 2026-06-30, the shadow quarter)
  hz1_window: {start: 2026-04-01, end: 2026-06-30}   # rev2 decision 4: 1 Hz controller rows April to June 2026 only
  timezone_store: UTC
  timezone_report: America/Chicago

# =====================================================================
# Plant behavior
# =====================================================================

shop:                                     # [plant] section 4
  calendar:
    shifts_local:
      first: {start: "06:00", end: "14:30"}
      second: {start: "14:30", end: "23:00"}
    workdays: [mon, tue, wed, thu, fri]
    holidays: [new_years_day, memorial_day, independence_day, labor_day, thanksgiving, day_after_thanksgiving, christmas_eve, christmas_day]
    saturday_first_shift_prob: {hmc: 0.35, other: 0.10}     # "occasional Saturday first shift"
  staffing: {supervisors: 1, technicians: 3}   # rev2 R2.1 (was 2)

production:                               # [plant] sections 4, 5.4
  utilization_cutting_over_scheduled:     # check 15: HMC cell 0.65 to 0.80
    hmc: 0.72
    vmc: 0.45                             # rev2 R2.11.5 (was 0.55)
    lathe: 0.45                           # rev2 (was 0.55)
    mill_turn: 0.50                       # rev2 (was 0.60)
    grinder: 0.40
  setup_share_of_noncutting: 0.55
  job_length_days_lognormal: {median: 3.0, sigma: 0.7}
  material_mix:                           # share of jobs by machine class
    hmc: {aluminum: 0.35, steel: 0.30, stainless: 0.20, cast_iron: 0.15, titanium: 0.0}
    vmc: {aluminum: 0.45, steel: 0.30, stainless: 0.20, cast_iron: 0.05, titanium: 0.0}
    lathe: {aluminum: 0.30, steel: 0.40, stainless: 0.30, cast_iron: 0.0, titanium: 0.0}
    mill_turn: {aluminum: 0.35, steel: 0.35, stainless: 0.30, cast_iron: 0.0, titanium: 0.0}
    grinder: {aluminum: 0.0, steel: 0.80, stainless: 0.20, cast_iron: 0.0, titanium: 0.0}
  cutting_regime_by_material:             # spindle speed as fraction of rated, spindle load pct (mean, sd)
    aluminum: {speed_frac: [0.67, 1.00], load_pct: [22, 6]}
    steel: {speed_frac: [0.33, 0.67], load_pct: [38, 8]}
    stainless: {speed_frac: [0.25, 0.50], load_pct: [45, 9]}
    cast_iron: {speed_frac: [0.33, 0.58], load_pct: [40, 8]}
    titanium: {speed_frac: [0.25, 0.38], load_pct: [58, 9]}
  flutes_by_material: {aluminum: [2, 3], steel: [4, 5], stainless: [4, 6], cast_iron: [5, 8], titanium: [4, 6]}
  programs_active_per_machine: {hmc: 40, vmc: 30, lathe: 25, mill_turn: 30, grinder: 10}
  new_programs_per_machine_month: {hmc: 3.0, vmc: 4.0, lathe: 4.0, mill_turn: 3.0, grinder: 0.5}
  tsc_use_share_of_cutting: 0.45            # each program's mean share of cutting minutes with the pump on; approved 2026-10-21
  flood_use_share_of_cutting: 0.75
  coolant_share_spread: 0.15                # per-program share drawn uniform within +/- spread of the mean (keeps the mean)

bearing_signature:                        # [plant] 8.1, McFadden and Smith; D'Elia et al.; Randall and Antoni
  resonance_fn_hz:                        # 4,000 to 8,000 per point
    spindle_front: 6800
    spindle_rear: 6200
    tsc_pump: 5200
    flood_pump: 4600
    compressor_motor: 4400
    compressor_airend: 5600
  resonance_fn_jitter_frac_by_point: 0.05 # point-to-point spread around the class value
  housing_resonance_gain_db: [6.0, 15.0]  # healthy broadband shaped by the point's SDOF housing response; resonance region this far above the floor, drawn per point; after run-02
  damping_ratio: {spindle: 0.060, pump: 0.045, compressor: 0.040}      # 0.03 to 0.06; spindle 0.050 -> 0.060 after pilot-01, approved 2026-10-20
  slip_jitter_frac: {spindle: 0.015, pump: 0.020, compressor: 0.020}   # 0.01 to 0.03
  amplitude_modulation_depth:             # inner-race load-zone depth drawn per instance by bearing type; after run-01 (was a single 0.6)
    inner_race_at_shaft_by_kind: {angular_contact_ball: [0.1, 0.3], deep_groove_ball: [0.5, 0.8], cylindrical_roller: [0.5, 0.8]}
    ball_at_cage: 0.4
  measurement_noise_snr_db: {spindle: 26, pump: 24, compressor: 24}
  defect_location_shares: {outer_race: 0.50, inner_race: 0.35, ball: 0.15}       # added pre-pilot, approved 2026-10-20
  axis_gain:                              # x radial, y radial (load direction), z axial; added pre-pilot
    impacts: [0.7, 1.0, 0.3]
    noise: [1.0, 1.0, 0.6]
  background:
    shaft_harmonics_g:                    # 1x, 2x, 3x acceleration amplitude at rated speed, healthy
      spindle: [0.020, 0.010, 0.005]
      pump: [0.040, 0.015, 0.008]
      compressor_motor: [0.050, 0.020, 0.010]
      compressor_airend: [0.060, 0.025, 0.010]
    lobe_pass_harmonics_g: [0.050, 0.020]  # airend, male rotor speed times lobe count
    tooth_pass_harmonics_g_per_load_pct: [0.0020, 0.0008, 0.0004]
    broadband_g_rms:                      # healthy structural and process noise, 10 Hz to 10 kHz
      spindle_light: 0.16
      spindle_heavy: 0.23
      pump: 0.30
      compressor: 0.35
    periodic_variance_share_max: 0.35     # keeps healthy kurtosis at or above 2.8 (check 2)
  transfer_function_by_mounting:          # gain and resonance shift after a remount
    remount_gain_range: [0.80, 1.25]
    remount_fn_shift_frac_range: [-0.06, 0.06]
  severity_to_impact:
    impact_peak_g_at_hi_1: {spindle: 6.0, pump: 9.0, compressor: 7.0}
    exponent: 1.0                         # impact amplitude proportional to health index
    amplitude_scatter_sigma_log: 0.3       # per-impact lognormal amplitude scatter (Antoni and Randall); added after pilot-02
  stage1_hf_rise_at_stage2: 0.5            # HF RMS rise from stage-1 broadband 2-10 kHz content, reached at stage-2 entry; added after pilot-01
  stage4:
    jitter_frac_at_failure: 0.15          # impacts smear, kurtosis and crest fall back
    broadband_gain_at_failure: 3.5
    shaft_harmonic_gain_at_failure: 2.5
    temp_rise_c_at_failure: {spindle: [12.0, 15.0], pump: [15.0, 20.0], compressor: [15.0, 20.0]}   # rev2 R2.6.2, drawn per instance, grows through stage 4 (was 9.0 all classes)
  stage3_temp_rise_c: [3.0, 5.0]           # rev2 R2.6.2: begins in stage 3 (was none)

bearing_degradation:                      # [plant] 8.2, exponential model (MathWorks; Saxena et al.)
  health_index:
    phi: 0.0
    theta_lognormal: {median: 0.010, sigma_log: 0.30}
    beta_per_running_h:                   # normal (mean, sd); sets stage-2-to-failure lead (check 5)
      spindle: [0.0048, 0.0010]           # rev2 R2.6.1: about 10 weeks stage 2 to failure (was [0.0065, 0.0013], about 7.5 weeks)
      tsc_pump: [0.0134, 0.0027]          # rev2: about 8 weeks (was [0.0270, 0.0054], about 4 weeks at 28 h per week)
      flood_pump: [0.0081, 0.0016]        # rev2: about 8 weeks (was [0.0162, 0.0032], about 4 weeks at 46 h per week)
      compressor: [0.0041, 0.0008]        # rev2: about 12 weeks (was [0.0061, 0.0012], about 8 weeks)
    noise: {sd: 0.10, ar1_per_h: 0.98}    # about 10 percent near the alarm level
  stage_thresholds_hi: {stage1: 0.0, stage2: 0.05, stage3: 0.25, stage4: 0.60}
  failure: {hi_threshold: 1.0, offset_days: [0, 10]}
  onset_weibull_shape: 2.1                # 1.8 to 2.4
  characteristic_life_running_h:          # older machines at the low end of each range
    spindle_front: {older: 18500, newer: 25000}     # 18,000 to 26,000
    spindle_rear: {older: 30500, newer: 39000}      # 30,000 to 40,000
    tsc_pump_motor: {older: 7500, newer: 10000}     # 7,000 to 11,000
    flood_pump_motor: {older: 9500, newer: 13000}   # 9,000 to 14,000
    compressor_motor: {older: 22000, newer: 28000}  # 20,000 to 30,000
    compressor_airend: {older: 40000, newer: 50000} # rev2 R2.6.3; older 40,000 h at pilot04 decision 4, the quoted Quincy industry figure (was 39,000 in v12; originally 27,000 and 38,000)
  hazard_multipliers:
    crash_remaining_life_factor: [0.3, 0.7]          # spindle front set, per collision above severity threshold
    lubrication_loss: 0.5                            # remaining life multiplier while the state persists
    age_class: {older: 1.0, newer: 1.0}              # age enters through characteristic life; kept neutral here

lubrication:                              # [plant] 8.3
  episodes_per_spindle_year: {older_hmc: 2.0, newer_hmc: 0.75}      # 1 to 3 on older; fewer on newer
  hf_rise_frac: [0.30, 0.80]
  temp_rise_c: [3.0, 10.0]                # rev2 R2.7.2 (was [3.0, 8.0])
  ramp_days: [5, 15]
  recovery_days: [1, 3]
  conversion_window_days: [20, 40]
  missed_lube_pm_rate_multiplier: 1.5
  inspection_detection_prob: {rise_at_least_5c: 0.75, below_5c: 0.25}   # rev2 R2.7.3 (was a flat 0.75)
  pm_clear_records_finding: true           # rev2 M9 (decision 1a): a lube PM that clears an active episode records a lubrication finding

crash:                                    # [plant] 8.4
  rate_per_machine_year: 1.5              # base before multipliers; effective about 3.6 with multipliers (target 2 to 5 effective); after run-01, was 2.5
  second_shift_multiplier: 1.5
  new_program_first_week_multiplier: 3.0
  severity_above_threshold_share: 0.10    # share of collisions above the register severity threshold
  outcome_proportions: {no_effect: 0.975, brinelling: 0.015, immediate_failure: 0.010}
  brinelling_initial_hi: 0.06             # stage 2 signature immediately after the event

pump:                                     # [plant] 8.5
  seal_wear: {onset_rate_per_pump_year: 0.30, growth_days_to_end: [60, 180]}
  impeller_wear: {onset_rate_per_pump_year: 0.15, growth_days_to_end: [90, 240]}   # TSC pump: internal clearance wear (positive displacement, rev2 R2.9.1); flood pump: impeller wear; code PMP-IMP
  wear_signature_at_end: {shaft_1x_gain: 2.0, broadband_gain: 1.6, temp_rise_c: 5.0}
  tsc_pressure_drop_frac_at_wear_end: 0.20
  cavitation:
    rate_per_pump_year: {tsc: 3.0, flood: 2.0}
    hf_rise_frac: [0.6, 2.0]
    operator_topup_prob_per_day: 0.30     # after the controller low-pressure alarm
    max_duration_days: 7
    tsc_wear_multipliers: {onset_hazard: 3.0, progression: 2.0}   # rev2 M5 (R2.9.2): TSC only, while a cavitation episode is active; engineering assumption
  seal_failure:
    rate_per_pump_year: {tsc: 0.25, flood: 0.10}
    wear_hazard_multiplier: 3.0
    pressure_drop_lead_h: [1, 6]

compressor:                               # [plant] 8.6
  lead_pattern_weeks: [CMP-01, CMP-02, CMP-03, CMP-04]   # rev2 R2.2: weekly lead rotation over four units, N+1 (was [CMP-01, CMP-01, CMP-02], standby about 0.6 of duty hours)
  lag_trim_share_of_lead_hours: null      # rev2: superseded by demand dispatch; the lag unit is a regular first-shift runner (was 0.15)
  demand_frac_of_one_unit: {first_shift: 1.5, first_shift_peak: 2.0, second_shift: 1.3, saturday: 1.0, off_shift: 0.0}   # rev2: 40 machines, about 400 cfm average and 550 peak, 280 cfm per unit (was 0.75, 0.65, 0.50, 0)
  first_shift_peak_hours_local: [8, 11]   # rev2: peak demand window (proposed)
  max_running_units: 3                    # rev2: one unit always standby
  unit_load_limit_frac: 0.9               # rev2: the sequencer starts the next unit when demand per unit would exceed this
  demand_noise_frac: 0.05                 # rev2: hour-to-hour demand spread around the shift value; units share the load equally
  load_unload_band_bar: [6.9, 7.6]
  discharge_temp_c: {base: 78.0, per_c_ambient: 0.5, per_load_frac: 10.0}
  airend_lube_events_per_running_h: 3.1e-4   # rev2 decision 7: run-06 duty unit, 1 per year over 3,230 running h (was airend_lube_events_per_year_duty 1, duty unit only)
  other_stoppages_per_running_h: 2.17e-4  # rev2 decision 7: 0.7 per duty running year of 3,230 h (was other_stoppages_per_running_year 0.7)
  other_stoppage_repair_hours: [2, 8]     # added with the stoppage rate
  oil_sample:
    particle_count_iso_code_healthy: [17, 15, 12]
    particle_count_multiplier_before_stage3: [2.0, 4.0]   # in the quarter before stage 3
    viscosity_cst: {nominal: 46.0, sd: 1.5}
    water_ppm: {median: 150, sigma_log: 0.4}

drawbar_force:                            # [plant] 5.3, monthly at PM, HMC only
  nominal_kn: 18.0
  gauge_sd_kn: 0.4
  spring_fatigue_frac_per_year: 0.04
  reset_on_spindle_rebuild: true
  gauge_ids: [DBG-01]

axis_wear:                                # [plant] 8.7, Bertolino et al. (2019)
  events_in_record: [6, 10]               # count drawn uniformly, then placed; rev2 R2.12 x2 fleet (was [3, 5])
  machine_weight: {older_vmc: 3.0, older_lathe: 3.0, newer_vmc: 1.0, newer_lathe: 1.0, hmc: 1.0, mill_turn: 1.0, grinder: 0.5}
  friction_multiplier_at_end: [1.10, 1.30]          # axis load p95 drift 10 to 30 percent
  preload_fraction_at_end: [0.50, 0.75]
  duration_months: [6, 18]
  backlash_entry_increase_um_at_end: [5, 15]

other_stoppages:                          # [plant] 8.8, work-order-level stoppages per machine-year
  rates_per_machine_year:
    atc_fault: 0.025
    pallet_changer_hydraulic: {hmc: 0.08, other: 0.0}
    servo_drive: 0.025
    electrical: 0.020
    lube_system: 0.012
    way_cover: 0.008
    chip_conveyor: 0.012
    coolant_pump_non_hmc: {hmc: 0.0, other: 0.020}
  repair_hours:
    atc_fault: [2, 8]
    pallet_changer_hydraulic: [3, 10]
    servo_drive: [4, 24]
    electrical: [2, 12]
    lube_system: [2, 6]
    way_cover: [3, 8]
    chip_conveyor: [2, 6]
    coolant_pump_non_hmc: [4, 12]
    ball_screw_or_guide: [24, 72]

controller_events:                        # [plant] 5.2, alarms cleared at the machine without a work order
  tool_breakage_per_cutting_hour: 0.004
  alarms_per_machine_year:
    atc_fault: 6.0
    servo: 2.0
    lube: 4.0
    hydraulic_low_pressure: {hmc: 3.0, other: 0.0}
    spindle_overheat: 0.5
    overload_below_crash: 4.0

benign:                                   # [plant] 8.9; episode count 10 to 20 per year
  episodes_per_year:
    heavy_new_program_hmc: 8.0            # regime shift on spindle points; rev2 x2 HMCs (was 4.0)
    coolant_concentration_drift_hmc: 8.0  # rev2 x2 HMCs (was 4.0)
    compressor_room_heat: 2.0             # room above 32 C for 3 or more days
  compressor_room_heat: {add_c: [3.0, 6.0], days: [3, 7], months: [6, 8]}   # outdoor heat wave adds 3 to 6 C over the seasonal room baseline (rev2 R2.3 comment); approved 2026-10-21
  heavy_new_program_load_gain: [1.20, 1.45]
  coolant_drift_spindle_load_gain: [1.04, 1.10]
  coolant_drift_duration_days: [7, 21]
  titanium_job: {machines: [HMC-01, HMC-02], start_window: [2024-09-01, 2025-03-31], duration_weeks: 4}
  sensor_remounts:                        # rev2: four in the record for 40 points (was two for 20)
    - {point: HMC-03-SP-F, date: 2024-08-12}
    - {point: CMP-01-AE, date: 2025-10-06}
    - {point: HMC-07-SP-R, date: 2024-04-15}
    - {point: CMP-04-MDE, date: 2025-02-10}
  ambient_room_c: {annual_mean: 22.0, annual_amplitude: 10.0, daily_amplitude: 3.5, daily_peak_hour_local: 15, coldest_day_of_year: 20}   # rev2 R2.3 (was 24.0, 11.0, 3.0)
  shop_ambient_c: {annual_mean: 21.5, annual_amplitude: 1.75}   # rev2 R2.3: heated and air-conditioned, no daily cycle (was 22.0, 4.0)

maintenance:                              # [plant] 8.10
  pm_program:
    hmc:
      spindle_lube_check: {basis: calendar_days, interval: 30}
      drawbar_force: {basis: calendar_days, interval: 30}
      tsc_filter: {basis: calendar_days, interval: 30}
      coolant_check: {basis: calendar_days, interval: 7}
      way_lube_hydraulic: {basis: calendar_days, interval: 91}
      backlash_check: {basis: calendar_days, interval: 182}
      tsc_pump_unit_replacement: {basis: calendar_days, interval: 730}
      spindle_rebuild_older: {basis: spindle_running_h, interval: 20000}
    vmc_lathe_mill_turn:
      lube: {basis: calendar_days, interval: 91}
      backlash_check: {basis: calendar_days, interval: 365}
    compressor:
      oil_sample: {basis: calendar_days, interval: 91}
      oil_filter_change: {basis: running_h, interval: 2000}
  pm_outcome_shares: {on_time: 0.70, late: 0.22, skipped: 0.08}   # completion compliance about 70 percent
  pm_late_days_lognormal: {median: 10, sigma: 0.6}
  alert_to_inspection_working_days: [1, 3]
  repeat_alert_inspection_prob: 0.20      # repeat alert within the window after a no_fault_found close
  repeat_alert_window_days: 30
  inspection_detection_prob_by_stage: {stage1: 0.03, stage2: 0.20, stage3: 0.70, stage4: 0.95}   # rev2 R2.6.4 (stage1 was 0.10)
  cavitation_found_if_active: true        # added pre-pilot
  wear_stage_by_fraction: [0.25, 0.50, 0.75]   # wear fraction edges for stages 2, 3, 4; added pre-pilot
  planned_repair_lead_days: [5, 21]
  planned_repair_windows: [weekend, pallet_cell_window]
  repair_time:
    spindle_rebuild_days: [3, 7]          # planned rebuilds; unplanned failures use spare_spindle below (rev2)
    pump_hours: [4, 12]
    compressor_bearing_days: [1, 3]
  rebaseline_after_component_replacement: true
  spare_spindle:                          # rev2 M4 (R2.8): one shared spare for the eight HMCs
    count: 1
    unplanned_swap_days: [3, 7]           # spare available: swap, alignment, run-in
    unplanned_no_spare_working_days: [10, 21]   # spare out being rebuilt
    rebuild_out_working_days: 15          # failed spindle out for rebuild, returns as the spare
    rebuild_labor: rebuild_shop           # decision 6: not technician labor
    resolve_max_passes: 5                 # decision 3: parallel run, resolve in time order, rerun changed groups until stable

sensor_temperature_rise_c:                # [plant] running rise over ambient; spindle scales with speed; added pre-pilot
  spindle: 5.0                            # rev2 R2.4: chilled spindle (was 10.0)
  pump: 15.0
  compressor_motor: 27.5                  # rev2 (was 25.0)
  compressor_airend: 35.0

sensor_temperature:                       # [plant] rev2 R2.4, M6 and section 5 of the build plan
  housing_lag_tau_h: 3.0                  # first-order lag of the housing on its drivers (was none)
  compressor_load_term: {base: 0.7, per_load_frac: 0.3}   # housing rise times (0.7 + 0.3 x load fraction), mean-preserving (was none)
  airend_share_of_fouling_residual: 0.5   # airend housing rise from oil cooler fouling (was none)

sensor_behavior:                          # [plant] 5.1
  install_dates: {first: 2023-07-05, last: 2023-07-11}   # rev2: HMC-05 to -08 on 07-10 and 07-11 (was last 2023-07-07)
  battery_life_months: [24, 42]           # rev2 R2.11.1 (was [14, 20])
  battery_gap_days: [1, 3]
  gateways: {GW-HMC: [HMC-01, HMC-02, HMC-03, HMC-04], GW-HMC2: [HMC-05, HMC-06, HMC-07, HMC-08], GW-CMP: [CMP-01, CMP-02, CMP-03, CMP-04]}   # rev2 (was GW-HMC and GW-CMP with two compressors)
  dropouts: {rate_per_gateway_year: 8.0, duration_h: [1, 12]}
  radio_noise_row_frac: 0.002
  radio_noise_modes: {temp_jump_c: [40, 60], spike_gain: [20, 50]}   # implausible-row forms: temperature jump, spike, stuck repeat

label_noise:                              # [plant] 5.3
  wrong_code_frac: 0.12                   # 0.10 to 0.15 of unplanned repairs
  missing_code_frac: 0.15                 # rev2 R2.11.4 (was 0.10)
  close_lag_days: [0, 2]                  # the 35 percent not batch-closed
  close_batch: {share: 0.65, weekday: fri, working_days_after_work: [0, 5]}   # rev2 R2.11.3 (was a flat 0 to 2 days)

economics:                                # [plant] 5.4, USD per hour
  contribution_margin_per_hour: {hmc: 185, vmc: 110, lathe: 95, mill_turn: 160, grinder: 80}

fault_conditions:                         # [plant] 8.11; approved 2026-10-21 before run-05
  imbalance:
    unit_classes: [tsc_pump, flood_pump, compressor]   # a unit is a pump or a compressor; on a compressor the point (motor or airend) is drawn
    onset_rate_per_unit_year: 0.18          # 0.1 to 0.25; about 5.4 episodes over 10 units (target 3 to 8)
    one_x_growth_factor: [2.0, 5.0]         # 2 to 5 times baseline 1x
    growth_weeks: [2, 12]                   # 2 to 12
    axial_share_of_radial: [0.2, 0.4]       # NEW magnitude: imbalance is radial, axial well under 50%
    untreated_days_for_hazard: 90           # 90
    bearing_hazard_multiplier: [1.5, 2.0]   # 1.5 to 2
    inspection_detection_prob: 0.8          # NEW: strobe or vibration pen finds it
  misalignment:
    unit_classes: [compressor]             # both points of the compressor
    onset_rate_per_unit_year: 0.10          # 0.05 to 0.15; about 0.6 gradual episodes (target 0 to 3)
    growth_weeks: [4, 12]                   # 4 to 12
    two_x_growth_factor: [3.0, 6.0]         # NEW magnitude
    one_x_growth_factor: [1.3, 1.8]         # NEW magnitude
    axial_share_of_radial_at_end: [0.6, 0.9]   # NEW magnitude: at least 50% of radial
    post_reinstallation_prob: 0.05          # 0.03 to 0.08
    post_repair_correction_days: [1, 3]     # 1 to 3
    untreated_days_for_hazard: 90
    bearing_hazard_multiplier: [1.5, 2.0]
    inspection_detection_prob: 0.7          # NEW
