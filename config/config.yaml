coolant_ingress:                          # [plant] 8.12; approved 2026-10-21 before run-05
  rotary_union_life_tsc_running_h: 4000     # 4,000 to 8,000; after run-05 (DEVIATIONS D-002), was 5000; about 7.4 leaks over 8 HMCs (target 4 to 12; rev2, was 3.4 over 4, 2 to 6)
