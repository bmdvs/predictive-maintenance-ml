  hydraulic_bar: {nominal: 70.0, noise: 0.3, alarm_drop: 15.0, fault_drop: 30.0}
  tsc_bar: {nominal: 69.0, noise: 0.5, cavitation_drop_frac: 0.25, seal_lead_drop_frac: 0.40}
