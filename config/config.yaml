    rule_alerts_per_instrumented_asset_month: [1.3, 1.9]   # amended 2026-10-29 at run07 checkpoint (a) under rule 8: run07 value 1.6 plus or minus 0.3; healthy-hour rate 4.7 per 1,000 spindle hours (run06 2.0); basis: the vendor baseline is set once per 21-day window, not regime-aware, on more windows in the larger cell; vendor rule unchanged; original [0.3, 1.0]
    shadow_year_failures_instrumented: [3, 14]     # rev2 shadow year (was shadow quarter [0, 4]); amended 2026-10-22 at checkpoint (a) under rule 8 (run-06 value 0); was [1, 4] (2026-10-21, run-02 value 1); original [2, 4]
    shadow_year_failures_uninstrumented: [6, 16]   # rev2 shadow year (was shadow quarter [1, 3])
    no_measurement_share: [0.10, 0.25]
