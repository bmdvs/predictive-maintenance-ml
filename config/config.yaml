  four_stage_ordering_skip_onset_in_baselining: true      # after run-06: ordering not tested for onsets inside the baselining window
  stage34_fall_frac_min_pump: 0.0                   # after run-05: pump bearings require a fall above 0, percentage reported (DEVIATIONS D-003)
  healthy_exceed_share_max: 0.05
  healthy_env_fault_keys: [bpfo, bpfi, bsf]         # FTF reported, not tested; after pilot-01; also used by check 4 after pilot-02
  rolling_window_h: 24
  rolling_min_readings: 6                           # minimum readings in the rolling window for peak statistics; after pilot-03
  lube_recovery_tolerance_frac: 0.10                # approved 2026-10-21: recovered when 24 h median HF is within 10% of the pre-episode median
  label_noise_ranges: {wrong_code: [0.10, 0.15], missing_code: [0.10, 0.20], close_lag_days: [0, 5]}   # rev2 R2.11.3-4 (was missing [0.05, 0.15], close lag [0, 2]); approved 2026-10-21
  label_noise_binomial_alpha: 0.05                  # after run-01: wrong and missing code shares tested against configured rates
  four_stage_tie_h: 24                              # after run-01: detections within 24 h are tied; tied counts as ordered
  band_contains_resonance_min_points: 18            # after run-02: check 18, points whose every selected band contains the configured resonance
  lube_recovery_window_h: 72                        # after run-03: check 7 pre and post windows, same load band (was 24)
  lube_recovery_min_measurable_episodes: 10         # after run-03: fewer measurable episodes makes the recovery test report-only
  lube_recovery_min_matched_hours: 12               # after run-02: fewer matched hours in either window is not measurable
  four_stage_exclude_pump_wear_above: 0.5           # after run-01
  four_stage_exclude_after_kurtosis_peak: [cavitation, imbalance, misalignment, looseness, coolant_ingress]   # before run-05: excluded when active on the point between the kurtosis peak and failure
  lube_recovery_post_start_days: 3                  # before run-05: post-clear window starts 3 days after the clear (was: ending at clear + 3 d)
  lube_recovery_exclude_bearing_stage_min: 2        # before run-05: episodes with a bearing at stage 2 or above on the point in either window are reported separately
  condition_hours_min_level: 0.5                    # before run-05: check 19 tests hours with the condition at half its developed level or more
  fault_signature_share_min: 0.90                   # before run-05: check 19
  condition_min_hours: 12                           # before run-05: check 19 tests a point and condition with at least this many hours
  post_reinstallation_binomial_alpha: 0.05          # before run-05: check 20
  post_reinstallation_correction_max_days: 3        # before run-05: check 20
  tsc_leak_drop_detect_min_frac: 0.025             # before run-05: check 21, measured TSC pressure drop before ingress
  thermal_residual_tolerance_c: 1.5                 # before run-05: check 22, measured rise against the configured range
  thermal_return_days: 3                            # before run-05: check 22
  thermal_return_share_min: 0.80                    # before run-05: check 22
  thermal_baseline_days: 14                         # before run-05: check 22 pre-episode residual baseline
  lube_conversion_censor_at_record_end: true        # after run-05: episodes whose conversion window ends after the record are not tested for conversion
