  front_bearing_hazard_multiplier: [2.0, 4.0]   # 2 to 4, persists after repair
  coolant_check_finds_leak_prob: 0.5        # NEW: weekly coolant check notices the leak
  inspection_detection_prob: 0.8            # NEW
