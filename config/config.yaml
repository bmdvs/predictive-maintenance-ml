    unit_classes: [tsc_pump, flood_pump, compressor]
    onset_rate_per_unit_year: 0.05          # 0.03 to 0.08; about 1.5 episodes (target 0 to 3)
    harmonic_gain_3x_10x: [2.0, 4.0]        # NEW magnitude
    half_x_share_of_1x: [0.2, 0.5]          # NEW magnitude
    noise_floor_rise_db: [3.0, 6.0]         # NEW magnitude
    inspection_detection_prob: 0.9          # NEW
  render: {max_order: 10, floor_band_hz: [10, 1000]}   # looseness harmonics up to 10x and its floor rise in the velocity band
  tool_assembly_imbalance:
    high_program_share: 0.07                # 5 to 10% of programs
