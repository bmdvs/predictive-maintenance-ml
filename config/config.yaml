    crash_spindle_failures_no_precursor: [2, 8]    # rev2 x2 (was [1, 4]); amended 2026-10-22 at checkpoint (a) under rule 8 (run-06 value 4); original [1, 3]
    hmc_pump_unplanned_failures: [8, 18]           # rev2 x2 amended for R2.6.1 (was [5, 9])
    compressor_unplanned_events: [5, 14]           # amended 2026-10-29 at run07 checkpoint (a) under rule 8 (run07 value 14: 12 trips at the approved per-running-hour rate, a tail outcome P = 0.022; seeds and rates unchanged); rev2 was [5, 10]; original [3, 5]
    axis_ball_screw_replacements: [6, 10]          # rev2 x2 (was [3, 5])
    hmc_lube_episodes_per_year: [8, 20]            # rev2 x2 spindles (was [4, 10])
