oil_cooler_fouling:                       # [plant] 8.13; approved 2026-10-21 before run-05
  onset_rate_per_running_h: 3.1e-4         # rev2 decision 7: run-06 duty unit rate, 1.0 per year over 3,230 running h; about 9 episodes (target 4 to 14) (was per unit-year duty 1.0, standby 0.5)
  discharge_temp_rise_c: [5.0, 15.0]        # 5 to 15
  rise_weeks: [4, 12]                       # 4 to 12
  summer_rate_multiplier: 1.5               # "faster in summer"
  summer_months: [6, 8]                     # June to August
  warning_discharge_temp_c: 100.0           # compressor controller warning event, no stop; approved 2026-10-21 (proposed single limit 105)
  trip_discharge_temp_c: 110.0              # high-temperature trip: unplanned stoppage and work order; approved 2026-10-21 (proposed 105)
  pm_records_fouling_above_c: 5.0           # the cleaning PM records fouling (a confirmed finding) above this rise; approved 2026-10-21
  annual_cleaning_pm_days: 365              # NEW PM task: cooler cleaning
  cleaning_recovery_days: [1, 3]            # NEW: back to baseline within 3 days (check 22)

spindle_cooling:                          # [plant] 8.14; approved 2026-10-21 before run-05
  onset_rate_per_hmc_year: 0.35             # 0.2 to 0.5; about 8.4 episodes (target 4 to 12; rev2, was 4.2 and 2 to 6)
  abrupt_share: 0.30                        # rev2 M2: pump, fan or compressor lock
  abrupt_residual_c: [15.0, 25.0]           # rev2 M2: carries the thermistor past 46 C while cutting
  abrupt_rise_h: [1, 4]                     # rev2 M2
  housing_share_of_residual: [0.5, 1.0]     # rev2 M1: both spindle housing points, drawn per episode, speed-scaled; engineering assumption
  housing_lag_tau_h: 3.0                    # rev2 M1: housing lags the thermistor
  thermistor_residual_rise_c: [2.0, 6.0]    # 2 to 6
