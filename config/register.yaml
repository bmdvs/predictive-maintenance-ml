# Asset register (CLAUDE.md section 5.5). Fault frequencies are computed from this geometry in code.
# Bearing geometry: ball (or roller) count, ball diameter mm, pitch diameter mm, contact angle deg.
# running_h_at_record_start is the component age on 2023-07-01.
# Revision 2 (2026-10-29): 40 machines, 8 HMCs, 4 compressors, 40 sensor points; new units follow the existing pattern
# of their class (approved at the build plan). Compressors carry lead_order for the four-unit rotation (was role: duty or standby).

bearing_types:
  7014C-P4: {kind: angular_contact_ball, n: 19, d_mm: 10.53, pitch_mm: 90.0, contact_deg: 15.0}   # d/D 0.117
