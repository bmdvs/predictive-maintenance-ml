# Replay scope: the machines and months the chain replays and lands.
replay:
  hmcs: [HMC-01, HMC-02, HMC-03, HMC-04, HMC-05, HMC-06, HMC-07, HMC-08]
  months: ["2026-04", "2026-05", "2026-06"]

ignition:
  gateway_url: http://localhost:8088
  container: idc-ignition
  # The gateway runs in trial mode; a restart begins a new two-hour trial period.
  trial_restart_minutes: 90
  opcua_url: opc.tcp://localhost:62541
  sparkplug_group: shop
  sparkplug_edge_node: main
  modbus_device: compressor-replay
  tag_folder: compressors
  tag_group: Fast
  tag_group_rate_ms: 100

# Development slices: small windows for building each stage before the full acceptance runs.
dev_slices:
  controller:
    machine_id: HMC-01
    day: 2026-06-09
  compressor:
    compressor_id: CMP-01
    start: 2026-06-01T11:00:00Z
    hours: 4
