# Paths, replay settings and acceptance targets for the connectivity chain.
# Machine-specific overrides go in config/chain.local.yaml (gitignored) with the same keys.

# Relative paths resolve from connectivity/, the parent of this config directory.
paths:
  # The repository's bronze exports, including the April to June 2026 1 Hz controller window.
  export_root: ../data/bronze
  # Where the landing writers put their output, in the same folder layout as export_root.
  landing_root: ./landing
  # Per-run reports (gap and integrity reports, comparison results).
  run_reports: ./runs
  # The repository's fleet register; the MTConnect device model is generated from it.
  register: ../config/register.yaml
  # Native device files the replay components serve (SHDR logs, Modbus register images).
  native_root: ./native

mtconnect:
  agent_url: http://localhost:5000
  # Replay speed multiple for the adapter (record seconds per wall second).
  replay_speed: 60
  # Observations requested per /sample call. The agent caps a response at the buffer size.
  sample_count: 5000
  # Wait between polls when the buffer has no new observations, in seconds.
  idle_poll_seconds: 0.5

mqtt:
  host: localhost
  port: 1883
  # ISA-95 topic root: enterprise/site. Area, work center and work unit are appended per machine.
  topic_root: shop/main
  # Raw edge layer: one JSON message per machine per record second.
  controller_topic: "{root}/machining/{cell}/{machine_id}/controller"
  status_topic: "{root}/machining/{cell}/{machine_id}/controller/status"
  qos: 1

modbus:
  # Modbus TCP port for the compressor replay server (502 requires administrator rights).
  port: 5020
  # Single-block mode: seconds each record minute is held before the next is loaded.
  hold_seconds: 2.0
  # Ring-buffer mode: record minutes written per tick, and seconds held after each tick.
  ring_minutes_per_tick: 5
  ring_hold_seconds: 0.5
  # Modbus unit (slave) IDs. One device per compressor, one for the room/dryer controller.
  unit_ids:
    CMP-01: 1
    CMP-02: 2
    CMP-03: 3
    CMP-04: 4
    room: 5

# Work center (cell) per machine class, for the ISA-95 path.
cells:
  hmc: cell-hmc
  vmc: cell-vmc
  lathe: cell-lathe
  mill_turn: cell-millturn
  grinder: cell-grind

landing:
  # The export files each controller row under the month of its plant-local date (shift days
  # run past UTC midnight), so the controller writer partitions in the plant time zone.
  controller_partition_timezone: America/Chicago

source_run:
