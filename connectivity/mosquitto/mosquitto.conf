# Mosquitto broker configuration for the connectivity chain.
# Mounted at /mosquitto/config/mosquitto.conf.
#
# The listener is unauthenticated for local use. A hardened deployment adds TLS, per-client
# credentials and topic ACLs.

listener 1883 0.0.0.0
allow_anonymous true

# Persist retained messages and queued QoS 1/2 messages for persistent sessions across
# broker restarts, so a landing writer that reconnects after a broker restart loses nothing.
persistence true
persistence_location /mosquitto/data/
autosave_interval 30

# Queue depth per persistent session. The MTConnect bridge publishes one message per record
# second; at replay speed 600 a writer that is down for a minute has 36,000 messages waiting.
max_queued_messages 1000000
max_inflight_messages 100

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
