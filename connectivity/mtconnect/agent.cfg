# MTConnect agent configuration for the connectivity chain.
# Mounted into the agent container at /mtconnect/config/agent.cfg.

Devices = Devices.xml
SchemaVersion = 2.7
Port = 5000
JsonVersion = 2
WorkerThreads = 2

# Sliding buffer of observations, as a power of two: 2^20 = 1,048,576 changes. A replayed
# machine-day at 1 Hz produces well under that, so a bridge that falls behind has time to
# catch up before the buffer wraps.
BufferSize = 20

# Adapter timestamps are authoritative: the replay carries record time on every SHDR line.
IgnoreTimestamps = false
ConversionRequired = false
UpcaseDataItemValue = true
MonitorConfigFiles = false

# Heartbeat: the agent pings each adapter and marks its device UNAVAILABLE on no reply.
LegacyTimeout = 600
ReconnectInterval = 5

Files {
  schemas { Path = /mtconnect/data/schemas  Location = /schemas/ }
  styles  { Path = /mtconnect/data/styles   Location = /styles/ }
}

logger_config {
  output = cout
  level = info
}

# Adapter host is the Windows host as seen from the container. host.docker.internal resolves
# to IPv6 first inside the container and the container has no IPv6 route, so the IPv4 alias
# is used directly.
Adapters {
