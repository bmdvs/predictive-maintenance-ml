bundle:
  name: pdm

# The workspace host is not set here: it comes from the CLI profile (DATABRICKS_CONFIG_PROFILE) or
# DATABRICKS_HOST, so no workspace identifier is committed.

include:
  - resources/*.yml

artifacts:
  pdm_wheel:
    type: whl
    build: python -m pip wheel --no-deps -w dist .
    path: .

sync:
  include:
    - config/*.yaml

variables:
  catalog:
    description: Unity Catalog catalog for all schemas
    default: pdm
  landing_root:
    description: Landing volume path holding the source exports
    default: /Volumes/pdm/landing/exports
  landing_volume_location:
    description: Storage location of the external volume pdm.landing.exports (abfss URL of the landing container's exports folder; set per target, never committed)
  schema_root:
    description: Auto Loader schema tracking location
    default: /Volumes/pdm/landing/exports/_schemas
  node_type:
    description: Single-node job cluster type (rule 15)
    default: Standard_D4ds_v5
  spark_version:
    description: Databricks Runtime for job clusters
    default: 15.4.x-scala2.12
  serverless_pipeline:
    description: Run the pipeline on serverless compute when the workspace offers it
    default: true

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
