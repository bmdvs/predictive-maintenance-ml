bundle:
  name: pdm

# The workspace host is not set here: it comes from the CLI profile (DATABRICKS_CONFIG_PROFILE) or
# DATABRICKS_HOST, so no workspace identifier is committed.

include:
  - resources/*.yml

artifacts:
  pdm_wheel:
    type: whl
    build: python infra/build_wheel.py
    path: .
    files:
      - source: dist/bundle/*.whl

sync:
  include:
    - config/*.yaml

variables:
  catalog:
    description: Unity Catalog catalog for all schemas
    default: pdm
  landing_root:
    description: Landing volume path holding the source exports
    default: /Volumes/pdm/landing/exports
  schema_root:
    description: Auto Loader schema tracking location
    default: /Volumes/pdm/landing/exports/_schemas
  node_type:
    description: Single-node job cluster type (rule 15)
    default: Standard_D4ds_v5
  spark_version:
    description: Databricks Runtime for job clusters (18 LTS, Python 3.12, which the wheel requires)
    default: 18.x-scala2.13
  experiment_root:
    description: MLflow experiment root for the training runs, split by target
    default: /Shared/pdm
  serverless_pipeline:
    description: Run the pipeline on serverless compute when the workspace offers it
    default: true
  deploy_sp:
    description: Application id of the deploy service principal, the prod run-as identity (BUNDLE_VAR_deploy_sp; never committed)
    default: ""

targets:
  dev:
    mode: development
    default: true
    variables:
      catalog: pdm_dev
      schema_root: /Volumes/pdm_dev/landing/autoloader/_schemas
      experiment_root: /Shared/pdm_dev
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.deploy_sp}
