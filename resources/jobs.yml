resources:
  jobs:
    pdm_monthly:
      name: pdm_monthly
      max_concurrent_runs: 1
      job_clusters:
        - job_cluster_key: single_node
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: ${var.node_type}
            num_workers: 0
            data_security_mode: SINGLE_USER
            spark_conf:
              spark.master: "local[*, 4]"
              spark.databricks.cluster.profile: singleNode
              spark.sql.session.timeZone: UTC
            custom_tags:
              ResourceClass: SingleNode
      tasks:
        - task_key: pipeline_update
          pipeline_task:
            pipeline_id: ${resources.pipelines.pdm_pipeline.id}
            full_refresh: false
        - task_key: train
          depends_on:
            - task_key: pipeline_update
          job_cluster_key: single_node
          spark_python_task:
            python_file: ../jobs/train_models.py
            parameters: ["--catalog", "${var.catalog}", "--config", "${workspace.file_path}/config/config.yaml"]
          libraries:
            - whl: ../dist/*.whl
        - task_key: score
          depends_on:
            - task_key: train
          job_cluster_key: single_node
          spark_python_task:
            python_file: ../jobs/score.py
            parameters: ["--catalog", "${var.catalog}", "--config", "${workspace.file_path}/config/config.yaml"]
          libraries:
            - whl: ../dist/*.whl
        - task_key: monitor
          depends_on:
            - task_key: score
          job_cluster_key: single_node
          spark_python_task:
            python_file: ../jobs/monitor.py
            parameters: ["--catalog", "${var.catalog}", "--config", "${workspace.file_path}/config/config.yaml"]
          libraries:
            - whl: ../dist/*.whl
