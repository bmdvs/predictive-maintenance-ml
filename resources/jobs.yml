# pdm_monthly: pipeline update, then train (per-point model challengers and the other training tasks),
# promote (register the challenger and move the champion alias when its gates pass), score (from the
# champion) and monitor, as Python wheel tasks on one shared single-node job cluster. auto_promote false
# registers and tags only, for a manual review cycle. as_of (YYYY-MM) sets the shadow-quarter month a
# run covers: every task reads data to the end of that month. train_stages (all, or a comma-separated
# subset of rule_floor, nbm, controller_health, survival, supervised) limits the train task;
# monitor_stages (all, evaluation, monitoring) limits the monitor task.
resources:
  jobs:
    pdm_monthly:
      name: pdm_monthly
      max_concurrent_runs: 1
      parameters:
        - name: auto_promote
          default: "true"
        - name: as_of
          default: ""
        - name: train_stages
          default: "all"
        - name: monitor_stages
          default: "all"
      job_clusters:
        - job_cluster_key: single_node
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: ${var.node_type}
            num_workers: 0
            data_security_mode: SINGLE_USER
            spark_conf:
              spark.master: "local[*, 4]"
              spark.databricks.cluster.profile: singleNode
              spark.sql.session.timeZone: UTC
            custom_tags:
              ResourceClass: SingleNode
      tasks:
        - task_key: pipeline_update
          pipeline_task:
            pipeline_id: ${resources.pipelines.pdm_pipeline.id}
            full_refresh: false
        - task_key: train
          depends_on:
            - task_key: pipeline_update
          job_cluster_key: single_node
          python_wheel_task:
            package_name: pdm
            entry_point: pdm-train-models
            named_parameters:
              catalog: ${var.catalog}
              config: ${workspace.file_path}/config/config.yaml
              as_of: "{{job.parameters.as_of}}"
              stages: "{{job.parameters.train_stages}}"
              experiment_root: ${var.experiment_root}
              job_run_id: "{{job.run_id}}"
          libraries:
            - whl: ../dist/bundle/*.whl
        - task_key: promote
          depends_on:
            - task_key: train
          job_cluster_key: single_node
          python_wheel_task:
            package_name: pdm
            entry_point: pdm-promote
            named_parameters:
              catalog: ${var.catalog}
              config: ${workspace.file_path}/config/config.yaml
              as_of: "{{job.parameters.as_of}}"
              experiment_root: ${var.experiment_root}
              job_run_id: "{{job.run_id}}"
              auto_promote: "{{job.parameters.auto_promote}}"
          libraries:
            - whl: ../dist/bundle/*.whl
        - task_key: score
          depends_on:
            - task_key: promote
          job_cluster_key: single_node
          python_wheel_task:
            package_name: pdm
            entry_point: pdm-score
            named_parameters:
              catalog: ${var.catalog}
              config: ${workspace.file_path}/config/config.yaml
              as_of: "{{job.parameters.as_of}}"
          libraries:
            - whl: ../dist/bundle/*.whl
        - task_key: monitor
          depends_on:
            - task_key: score
          job_cluster_key: single_node
          python_wheel_task:
            package_name: pdm
            entry_point: pdm-monitor
            named_parameters:
              catalog: ${var.catalog}
              config: ${workspace.file_path}/config/config.yaml
              as_of: "{{job.parameters.as_of}}"
              stages: "{{job.parameters.monitor_stages}}"
          libraries:
            - whl: ../dist/bundle/*.whl
