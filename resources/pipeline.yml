# pdm_pipeline as built by hand in the pipeline editor: sources by file pattern under pipelines/, serverless with
# Photon, triggered, the pdm wheel as the environment dependency and the six configuration keys the
# pipeline sources read. The hand-built pipeline already exists; bind it before the first deploy of a
# target that should own it (infra/README.md), otherwise a deploy creates a second pipeline.
resources:
  pipelines:
    pdm_pipeline:
      name: pdm_pipeline
      catalog: ${var.catalog}
      schema: bronze
      continuous: false
      serverless: ${var.serverless_pipeline}
      photon: true
      channel: CURRENT
      root_path: ..
      libraries:
        - glob:
            include: ../pipelines/**
      environment:
        dependencies:
          - ../dist/*.whl
      configuration:
        pdm.catalog: ${var.catalog}
        pdm.landing_root: ${var.landing_root}
        pdm.schema_root: ${var.schema_root}
        pdm.config_path: ${workspace.file_path}/config/config.yaml
        spark.sql.legacy.parquet.nanosAsLong: "true"
        spark.sql.session.timeZone: UTC
