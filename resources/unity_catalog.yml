# Unity Catalog schemas and the landing volume. Catalog pdm, its managed location, the storage
# credential and the external locations are not bundle resources; infra/unity_catalog.sh holds them.
# These are declared for the prod target only, so development mode does not create prefixed copies.
# Where the objects already exist, bind each one before the first prod deploy, as listed in
# infra/README.md.
targets:
  prod:
    resources:
      schemas:
        landing:
          name: landing
          catalog_name: ${var.catalog}
          comment: Landing volume for the source exports
        bronze:
          name: bronze
          catalog_name: ${var.catalog}
          comment: Source export tables loaded by Auto Loader
        silver:
          name: silver
          catalog_name: ${var.catalog}
          comment: Cleaned, aligned and regime-tagged tables
        gold:
          name: gold
          catalog_name: ${var.catalog}
          comment: Features, rule floor, model scores, cases, work requests and evaluation
        ml:
          name: ml
          catalog_name: ${var.catalog}
          comment: Registered models
        monitoring:
          name: monitoring
          catalog_name: ${var.catalog}
          comment: Data quality, profiling and event performance
      volumes:
        exports:
          name: exports
          catalog_name: ${var.catalog}
          schema_name: landing
          volume_type: EXTERNAL
          storage_location: ${var.landing_volume_location}
          comment: Source exports by system
